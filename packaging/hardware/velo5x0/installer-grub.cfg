serial --unit=1 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial
set default=0
set timeout=3
menuentry "Ly Route - VeloCloud Edge 5x0 Installer" {
    linux /live/vmlinuz boot=live components console=tty0 console=ttyS1,115200n8 acpi_enforce_resources=lax libata.force=noncq systemd.show_status=true lyroute.autoinstall=1 lyroute.console=ttyS1
    initrd /live/initrd.img
}
menuentry "Ly Route - VeloCloud Edge 5x0 Rescue" {
    linux /live/vmlinuz boot=live components console=tty0 console=ttyS1,115200n8 acpi_enforce_resources=lax libata.force=noncq systemd.show_status=true
    initrd /live/initrd.img
}
